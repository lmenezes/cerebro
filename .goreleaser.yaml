version: 2
project_name: cerebro

builds:
  - main: ./cmd/cerebro
    binary: cerebro
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, cerebro.example.yaml]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  draft: true
