name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  # 对真实 ES 跑一遍所有接口（开启安全认证）
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        es: ["7.17.29", "8.19.5", "9.3.2"]
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.es }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          xpack.security.http.ssl.enabled: "false"
          xpack.ml.enabled: "false"
          ELASTIC_PASSWORD: changeme
          ES_JAVA_OPTS: -Xms1g -Xmx1g
          path.repo: /tmp/snapshots
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf -u elastic:changeme http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -tags integration -count=1 -run TestIntegration -v ./internal/server/
        env:
          CEREBRO_IT_ES_URL: http://localhost:9200
          CEREBRO_IT_ES_USER: elastic
          CEREBRO_IT_ES_PASSWORD: changeme

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # 新旧前端逐像素比对（假 ES 回放录好的数据，同一个 Go 后端）
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: web/test-results/

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cerebro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cerebro:ci
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
